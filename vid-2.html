    * {

    }

    body {
      margin: 0;
      background: #090909;
      color: #fff;

    .container {
      width: min(94%, 600px);

      background: #151515;
      border: 1px solid #282828;
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    video {
      width: 100%;
      display: block;
      border-radius: 12px;
      background: #000;

    .title {

    .info {

      text-align: center;
      text-decoration: none;
      font-size: 15px;
      font-weight: bold;
    }

    .watch:active {

    }

    footer {
      text-align: center;
      color: #555;
      font-size: 11px;
      margin-top: 25px;
    }
