<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Kumpulan video viral terbaru dan terpopuler."
  >

  <meta
    name="robots"
    content="index,follow"
  >

  <title>KUMPULAN VIDEO VIRAL</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header class="topbar">

    <div class="profile">

      <img
        src="https://photos.app.goo.gl/yskSVz8sfYd47Lfb6"
        alt="Profile"
        loading="lazy"
      >

    </div>

    <div class="brand">

      <h1>
        KUMPULAN VIDEO VIRAL
      </h1>

      <p>
        Video terbaru dan terpopuler
      </p>

    </div>

  </header>


  <!-- =========================
       MAIN
  ========================== -->

  <main>

    <!-- =========================
         HERO
    ========================== -->

    <section class="hero">

      <h2>
        Video Viral Terbaru
      </h2>

      <p>
        Pilih video yang ingin kamu tonton.
      </p>

    </section>


    <!-- =========================
         VIDEO LIST
    ========================== -->

    <section
      id="videoList"
      class="video-grid"
      aria-label="Daftar video"
    >

      <div class="loading">
        Memuat video...
      </div>

    </section>

  </main>


  <!-- =========================
       FOOTER
  ========================== -->

  <div class="bottom-info">
    © 2026 Kumpulan Video Viral
  </div>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script src="script.js"></script>

</body>
</html>
