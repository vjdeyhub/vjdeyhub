<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Tonton video viral terbaru.">
  <meta name="robots" content="index,follow">

  <title>Video</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>

<header class="topbar">

  <a href="./index.html" class="back-button">
    ← Kembali
  </a>

  <div class="brand">
    <h1>KUMPULAN VIDEO VIRAL</h1>
    <p>Video terbaru dan terpopuler</p>
  </div>

</header>


<main class="player-page">

  <div class="video-container">

    <video
      id="videoPlayer"
      controls
      playsinline
      preload="metadata"
    ></video>

  </div>


  <section class="video-title">

    <h2 id="videoTitle">
      Memuat video...
    </h2>

    <p id="videoDescription">
      Selamat menonton.
    </p>

  </section>


  <div class="action-area">

    <button
      type="button"
      id="watchButton"
      class="watch-button"
    >
      ▶ Tonton Video
    </button>

    <div class="ad-note">
      Klik tombol untuk mulai menonton
    </div>

  </div>


  <section class="related-section">

    <h3>Video lainnya</h3>

    <div
      id="relatedVideos"
      class="related-grid"
    ></div>

  </section>

</main>


<div class="bottom-info">
  © 2026 Kumpulan Video Viral
</div>


<script src="./script.js"></script>

</body>
</html>
