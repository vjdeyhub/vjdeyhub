<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Video Viral</title>
  <meta name="description" content="Tonton video viral terbaru.">
  <meta name="robots" content="index,follow">

  <link rel="stylesheet" href="style.css">

  <!-- ADSTERRA POPUNDER -->
  <script src="https://conductivebreeds.com/db/79/3a/db793a3e57b74080ac30338894ba8a75.js"></script>
</head>

<body>

  <header class="topbar">

    <a href="index.html" class="back-button">
      ← Kembali
    </a>

    <div class="brand">
      <h1>KUMPULAN VIDEO VIRAL</h1>
    </div>

  </header>

  <main class="player-page">

    <div class="video-container">

      <video
        id="videoPlayer"
        controls
        playsinline
        preload="metadata"
      >
        Browser Anda tidak mendukung video.
      </video>

    </div>

    <div class="video-title">

      <h2 id="videoTitle">
        Video Viral
      </h2>

      <p id="videoDescription">
        Selamat menonton.
      </p>

    </div>

    <div class="action-area">

      <button
        id="watchButton"
        class="watch-button"
        type="button"
      >
        ▶ TONTON VIDEO
      </button>

      <p class="ad-note">
        Klik tombol untuk mulai menonton
      </p>

    </div>

    <section class="related-section">

      <h3>🔥 Video Lainnya</h3>

      <div id="relatedVideos" class="related-grid"></div>

    </section>

  </main>

  <footer class="bottom-info">
    © KUMPULAN VIDEO VIRAL
  </footer>

  <script src="script.js"></script>

</body>
</html>
