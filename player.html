<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Video Player - Kumpulan Video Viral</title>

    <meta name="description" content="Tonton video viral terbaru dan terpopuler.">

    <!-- =====================================================
         MONETAG POPUNDER
         ZONE: 11840950
    ====================================================== -->
    <script>
    (function(s){
        s.dataset.zone='11840950',
        s.src='https://al5sm.com/tag.min.js'
    })([document.documentElement, document.body]
    .filter(Boolean)
    .pop()
    .appendChild(document.createElement('script')))
    </script>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <div class="header-inner">

            <a href="index.html" class="logo">
                KUMPULAN <span>VIDEO VIRAL</span>
            </a>

            <a href="index.html" class="back-btn">
                ← Kembali
            </a>

        </div>
    </header>


    <!-- MAIN -->
    <main class="player-page">

        <!-- VIDEO PLAYER -->
        <section class="player-container">

            <div class="video-wrapper">

                <video
                    id="videoPlayer"
                    controls
                    autoplay
                    playsinline
                    preload="metadata">
                </video>

            </div>


            <!-- VIDEO INFO -->
            <div class="video-info">

                <h1 id="videoTitle">
                    Memuat video...
                </h1>

                <p id="videoDescription">
                    Silakan tunggu sebentar...
                </p>

            </div>

        </section>


        <!-- RELATED VIDEOS -->
        <section class="related-section">

            <h2>Video Lainnya</h2>

            <div id="relatedVideos" class="related-grid">
                <!-- Diisi otomatis oleh script.js -->
            </div>

        </section>

    </main>


    <!-- FOOTER -->
    <footer class="footer">
        <p>
            © 2026 Kumpulan Video Viral
        </p>
    </footer>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>
</html>
