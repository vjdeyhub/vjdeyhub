<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="index,follow"
  >

  <title>Video - KUMPULAN VIDEO VIRAL</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <!-- =========================
       ADSTERRA POPUNDER
  ========================== -->

  <script
    src="https://conductivebreeds.com/db/79/3a/db793a3e57b74080ac30338894ba8a75.js">
  </script>

</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header class="topbar">

    <a
      href="index.html"
      class="back-button"
    >
      ← Kembali
    </a>

    <div class="brand">

      <h1>
        KUMPULAN VIDEO VIRAL
      </h1>

      <p>
        Video terbaru dan terpopuler
      </p>

    </div>

  </header>


  <!-- =========================
       PLAYER PAGE
  ========================== -->

  <main class="player-page">

    <!-- =========================
         VIDEO PLAYER
    ========================== -->

    <div class="video-container">

      <video
        id="videoPlayer"
        controls
        playsinline
        preload="metadata"
      ></video>

    </div>


    <!-- =========================
         VIDEO INFORMATION
    ========================== -->

    <section class="video-title">

      <h2 id="videoTitle">
        Memuat video...
      </h2>

      <p id="videoDescription">
        Selamat menonton.
      </p>

    </section>


    <!-- =========================
         RELATED VIDEOS
    ========================== -->

    <section class="related-section">

      <h3>
        Video lainnya
      </h3>

      <div
        id="relatedVideos"
        class="related-grid"
      ></div>

    </section>

  </main>


  <!-- =========================
       FOOTER
  ========================== -->

  <div class="bottom-info">
    © 2026 Kumpulan Video Viral
  </div>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script src="script.js"></script>

</body>
</html>
